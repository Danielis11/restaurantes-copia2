<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo - Descubre Jalpan a través de la comida</title>
    <meta name="description"
        content="Explora el mapa interactivo de Jalpan de Serra. Encuentra la ubicación exacta de los mejores restaurantes, bares y cafeterías.">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico">

    <!-- Estilos -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/ui-enhancements.css">
    <script src="/js/ui-enhancements.js" defer></script>
    <script src="/js/i18n.js" defer></script>

    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- Mapbox GL JS -->
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />

    <!-- Estilos de la página de mapa -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: var(--gray-50);
            color: var(--gray-800);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* El CSS global de la barra de navegación '.header.global-nav' se movió a style.css */

        /* ===== MAPA CONTAINER ===== */
        .map-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            margin-top: 70px;
        }

        .map-wrapper {
            flex: 1;
            width: 100%;
            position: relative;
            min-height: calc(100vh - 70px);
        }

        #public-map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* ===== Panel lateral ===== */
        .map-sidebar {
            position: absolute; top: 16px; left: 16px; bottom: 16px; z-index: 10;
            width: 340px; display: flex; flex-direction: column;
            background: rgba(255,255,255,.97); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border-radius: 20px; border: 1px solid rgba(15,23,42,.06);
            box-shadow: 0 12px 40px rgba(15,23,42,.14);
            padding: 1.15rem 1.15rem 0; overflow: hidden;
            animation: mpEntra .45s cubic-bezier(.2,.8,.2,1) both;
        }
        @keyframes mpEntra { from { opacity: 0; transform: translateX(-14px); } }
        .mp-asa { display: none; }
        .mp-cab { display: flex; align-items: flex-start; justify-content: space-between; gap: .75rem; }
        .map-sidebar h2 { font-size: 1.2rem; font-weight: 700; letter-spacing: -.02em; color: #111827; margin: 0; line-height: 1.2; }
        .mp-total { font-size: .82rem; color: #6b7280; margin: .15rem 0 0; }
        .mp-cerca { flex-shrink: 0; display: inline-flex; align-items: center; gap: .4rem; padding: .45rem .75rem; border: 0; border-radius: 99px; background: #eff6ff; color: #1d4ed8; font: inherit; font-size: .8rem; font-weight: 600; cursor: pointer; transition: background .2s, color .2s, transform .2s; }
        .mp-cerca:hover { background: #dbeafe; }
        .mp-cerca:active { transform: scale(.96); }
        .mp-cerca.activo { background: #2563eb; color: #fff; }
        .mp-cerca.buscando i { animation: mpPulso 1s ease-in-out infinite; }
        @keyframes mpPulso { 50% { opacity: .3; } }

        .mp-buscar { position: relative; display: flex; align-items: center; margin: .9rem 0 .7rem; }
        .mp-buscar > i { position: absolute; left: .85rem; color: #9ca3af; font-size: .85rem; pointer-events: none; transition: color .2s; }
        .mp-buscar input { width: 100%; padding: .65rem 2.2rem .65rem 2.3rem; border: 1px solid #e5e7eb; border-radius: 12px; background: #f9fafb; font: inherit; font-size: .9rem; color: #111827; transition: border-color .2s, background .2s, box-shadow .2s; }
        .mp-buscar input::-webkit-search-cancel-button { display: none; }
        .mp-buscar input:focus { outline: none; background: #fff; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
        .mp-buscar:focus-within > i { color: #2563eb; }
        .mp-limpiar { position: absolute; right: .45rem; width: 26px; height: 26px; border: 0; border-radius: 50%; background: #e5e7eb; color: #4b5563; font-size: .7rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .mp-limpiar[hidden] { display: none; }

        .mp-chips { display: flex; gap: .4rem; overflow-x: auto; scrollbar-width: none; margin: 0 -1.15rem; padding: 0 1.15rem .85rem; border-bottom: 1px solid #f3f4f6; }
        .mp-chips::-webkit-scrollbar { display: none; }
        .filter-btn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: .4rem; padding: .4rem .7rem; border-radius: 99px; border: 1px solid #e5e7eb; background: #fff; color: #374151; font: inherit; font-size: .82rem; font-weight: 500; cursor: pointer; transition: background .2s, color .2s, border-color .2s, transform .15s; }
        .filter-btn:hover { border-color: #d1d5db; background: #f9fafb; }
        .filter-btn:active { transform: scale(.95); }
        .filter-btn i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, #111827); transition: background .2s; }
        .filter-btn b { font-weight: 600; font-size: .72rem; color: #9ca3af; transition: color .2s; }
        .filter-btn.active { background: var(--c, #111827); border-color: var(--c, #111827); color: #fff; }
        .filter-btn.active i { background: rgba(255,255,255,.85); }
        .filter-btn.active b { color: rgba(255,255,255,.8); }
        .filter-btn.vacio { display: none; }

        .mp-lista { flex: 1; overflow-y: auto; overscroll-behavior: contain;margin: 0 -1.15rem; padding: .6rem .6rem 1rem; display: flex; flex-direction: column; gap: 2px; scrollbar-width: thin; }
        .mp-seccion { font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #9ca3af; padding: .35rem .55rem .25rem; }
        .list-item { display: flex; align-items: center; gap: .75rem; padding: .55rem; border-radius: 14px; cursor: pointer; transition: background .2s; animation: mpItem .35s ease both; animation-delay: calc(var(--i, 0) * 30ms); position: relative; flex-shrink: 0; }
        @keyframes mpItem { from { opacity: 0; transform: translateY(6px); } }
        .list-item:hover, .list-item.resaltado { background: #f3f4f6; }
        .list-item.activo { background: #eff6ff; }
        .list-item.activo::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--c); }
        .mp-foto { width: 52px; height: 52px; border-radius: 12px; flex-shrink: 0; position: relative; background: #f3f4f6; color: var(--c); display: flex; align-items: center; justify-content: center; font-size: 1.05rem; overflow: hidden; }
        .mp-foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .3s, transform .3s; }
        .mp-foto img.ok { opacity: 1; }
        .mp-foto img.logo { object-fit: contain; background: #fff; padding: 4px; }
        .list-item:hover .mp-foto img.ok:not(.logo) { transform: scale(1.06); }
        .list-item-content { flex: 1; min-width: 0; }
        .list-item-title { font-size: .93rem; font-weight: 600; color: #111827; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mp-meta { display: flex; align-items: center; gap: .4rem; font-size: .76rem; color: #6b7280; margin-top: 1px; white-space: nowrap; overflow: hidden; }
        .mp-meta .mp-tipo { color: var(--c); font-weight: 600; }
        .mp-meta .mp-est { color: #374151; font-weight: 600; }
        .mp-meta .mp-est i { color: #f59e0b; font-size: .7rem; }
        .mp-meta .mp-nuevo { color: #059669; font-weight: 600; }
        .list-item-address { font-size: .76rem; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
        .mp-dist { flex-shrink: 0; align-self: flex-start; margin-top: .2rem; font-size: .72rem; font-weight: 600; color: #1d4ed8; background: #eff6ff; padding: .12rem .45rem; border-radius: 99px; }
        .mp-ir { flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: .75rem; text-decoration: none; transition: color .2s, background .2s, transform .2s; }
        .mp-ir:hover { color: #fff; background: var(--c); }
        .list-item:hover .mp-ir { color: #374151; }
        .list-item:hover .mp-ir:hover { color: #fff; }
        .mp-vacio { text-align: center; padding: 2rem 1rem; color: #6b7280; font-size: .9rem; }
        .mp-vacio i { display: block; font-size: 1.5rem; color: #d1d5db; margin-bottom: .6rem; }
        .mp-vacio button { margin-top: .75rem; border: 0; background: #f3f4f6; color: #111827; font: inherit; font-size: .85rem; font-weight: 600; padding: .45rem .9rem; border-radius: 99px; cursor: pointer; }
        .mp-esq { height: 64px; flex-shrink: 0; border-radius: 14px; margin: 0 .1rem 6px; background: linear-gradient(90deg, #f3f4f6 25%, #f9fafb 50%, #f3f4f6 75%); background-size: 200% 100%; animation: mpBrillo 1.2s linear infinite; }
        @keyframes mpBrillo { to { background-position: -200% 0; } }

        /* Pines */
        .marker-wrapper { cursor: pointer; }
        .custom-marker { width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 6px rgba(0,0,0,.3); border: 2px solid #fff; transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s; }
        .custom-marker i { color: #fff; transform: rotate(45deg); font-size: 12px; }
        .marker-wrapper:hover .custom-marker, .marker-wrapper.resaltado .custom-marker { transform: rotate(-45deg) scale(1.25); box-shadow: 0 6px 14px rgba(0,0,0,.35); }
        .marker-wrapper.resaltado, .marker-wrapper.activo { z-index: 5; }
        .marker-wrapper.activo .custom-marker { transform: rotate(-45deg) scale(1.4); box-shadow: 0 8px 18px rgba(0,0,0,.35); animation: mpSalto .55s ease; }
        @keyframes mpSalto { 0% { transform: rotate(-45deg) scale(1); } 45% { transform: rotate(-45deg) translate(8px,-8px) scale(1.4); } 100% { transform: rotate(-45deg) scale(1.4); } }

        /* Popup del lugar */
        .mapboxgl-popup { z-index: 6; }
        .mapboxgl-popup-content { padding: 0; border-radius: 18px; overflow: hidden; box-shadow: 0 16px 40px rgba(15,23,42,.22); border: none; width: 270px; animation: mpPop .3s cubic-bezier(.2,.8,.2,1); }
        @keyframes mpPop { from { opacity: 0; transform: translateY(8px) scale(.96); } }
        .mapboxgl-popup-tip { display: none; }
        .popup-header { height: 130px; width: 100%; background: #f3f4f6; position: relative; }
        .popup-header img { width: 100%; height: 100%; object-fit: cover; }
        .popup-badge { position: absolute; left: 10px; bottom: 10px; padding: 3px 10px; border-radius: 99px; font-size: .72rem; font-weight: 600; color: #fff; text-transform: capitalize; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
        .popup-body { padding: .9rem 1rem 1rem; }
        .popup-title { font-size: 1.05rem; font-weight: 700; color: #111827; margin: 0 0 .2rem; line-height: 1.25; }
        .popup-rating { display: flex; align-items: center; gap: .3rem; font-size: .8rem; color: #6b7280; margin-bottom: .4rem; }
        .popup-rating i { color: #f59e0b; font-size: .75rem; }
        .popup-rating b { color: #111827; }
        .popup-address { font-size: .82rem; color: #6b7280; margin-bottom: .85rem; display: flex; align-items: flex-start; gap: .35rem; line-height: 1.35; }
        .popup-address i { margin-top: 3px; }
        .popup-acciones { display: flex; gap: .5rem; }
        .popup-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: .4rem; padding: .6rem .5rem; color: #fff; text-decoration: none; border-radius: 12px; font-size: .88rem; font-weight: 600; transition: filter .2s, transform .15s; }
        .popup-btn:hover { filter: brightness(1.08); color: #fff; }
        .popup-btn:active { transform: scale(.97); }
        .popup-btn.sec { flex: 0 0 auto; width: 42px; background: #f3f4f6; color: #374151; }
        .popup-btn.sec:hover { background: #e5e7eb; color: #111827; filter: none; }
        .mapboxgl-popup-close-button { width: 28px; height: 28px; background: rgba(255,255,255,.92); color: #111827; border-radius: 50%; right: 8px; top: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
        .mapboxgl-popup-close-button:hover { background: #fff; }

        /* Volver a la vista anterior */
        .mp-volver { position: absolute; top: 16px; left: 50%; z-index: 11; transform: translate(-50%, -20px); opacity: 0; pointer-events: none; display: inline-flex; align-items: center; gap: .45rem; padding: .55rem 1rem; border: 0; border-radius: 99px; background: #111827; color: #fff; font: inherit; font-size: .85rem; font-weight: 600; box-shadow: 0 8px 24px rgba(15,23,42,.25); cursor: pointer; transition: opacity .25s, transform .3s cubic-bezier(.2,.8,.2,1); }
        .mp-volver.visible { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
        .mp-volver:hover { background: #2563eb; }

        @media (prefers-reduced-motion: reduce) {
            .map-sidebar, .list-item, .mp-esq, .marker-wrapper.activo .custom-marker, .mapboxgl-popup-content { animation: none !important; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .map-sidebar {
                left: 0; right: 0; width: auto; top: auto;
                bottom: var(--mp-nav, 0px);
                height: 46%; border-radius: 20px 20px 0 0; padding-top: .2rem;
                border-bottom: 0;
                box-shadow: 0 -8px 30px rgba(15,23,42,.14);
                transition: height .35s cubic-bezier(.2,.8,.2,1);
                animation-name: mpSube;
            }
            @keyframes mpSube { from { transform: translateY(30px); opacity: 0; } }
            /* La página no se desplaza: el mapa ocupa justo la pantalla (dvh = alto real en celular y en la app instalada) */
            html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
            body { padding-bottom: 0 !important; }
            .map-section { flex: none; height: calc(100vh - 70px); height: calc(100dvh - 70px); }
            .map-wrapper { min-height: 0; height: 100%; }
            /* Abierta deja una franja de mapa arriba: tocarla o deslizar hacia abajo la cierra */
            .map-sidebar.abierto { height: calc(100% - var(--mp-nav, 0px) - 96px); }
            .map-sidebar.mini { height: 150px; }
            .map-sidebar.arrastrando { transition: none; }
            .mp-asa { display: flex; justify-content: center; width: 100%; padding: .55rem 0 .6rem; border: 0; background: none; cursor: grab; flex-shrink: 0; touch-action: none; }
            .mp-cab { touch-action: none; }
            .mp-asa span { width: 40px; height: 4px; border-radius: 4px; background: #d1d5db; }
            .map-sidebar h2 { font-size: 1.05rem; }
            .mp-buscar { margin: .55rem 0 .5rem; }
            .mp-buscar input { font-size: 16px; padding-top: .55rem; padding-bottom: .55rem; }
            .mp-chips { padding-bottom: .6rem; }
            .mp-volver { top: 12px; }
            /* Con un lugar abierto, la lista se esconde y la ficha queda abajo: el mapa queda libre para moverse */
            .map-sidebar.oculto { transform: translateY(calc(100% + 20px)); pointer-events: none; transition: transform .3s cubic-bezier(.2,.8,.2,1); }
        }

        /* Ficha del lugar en celular (en vez del globo sobre el mapa) */
        .mp-ficha {
            position: absolute; left: 10px; right: 10px; z-index: 12;
            bottom: calc(var(--mp-nav, 0px) + 10px);
            display: flex; gap: .75rem; padding: .7rem; padding-right: 2.4rem;
            background: #fff; border-radius: 18px;
            box-shadow: 0 12px 36px rgba(15,23,42,.24);
            animation: mpFicha .32s cubic-bezier(.2,.8,.2,1);
        }
        .mp-ficha[hidden] { display: none; }
        @keyframes mpFicha { from { opacity: 0; transform: translateY(24px); } }
        .mp-ficha-foto { width: 92px; flex-shrink: 0; align-self: stretch; min-height: 92px; border-radius: 12px; overflow: hidden; background: #f3f4f6; }
        .mp-ficha-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .mp-ficha-foto img.logo { object-fit: contain; background: #fff; padding: .5rem; }
        .mp-ficha-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .mp-ficha-tipo { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
        .mp-ficha-info h3 { font-size: 1rem; font-weight: 700; color: #111827; margin: .05rem 0 .1rem; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .mp-ficha-info .popup-rating { margin-bottom: .1rem; }
        .mp-ficha-dir { font-size: .78rem; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: .5rem; }
        .mp-ficha .popup-acciones { margin-top: auto; }
        .mp-ficha .popup-btn { padding: .5rem .5rem; font-size: .85rem; }
        .mp-ficha-cerrar { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border: 0; border-radius: 50%; background: #f3f4f6; color: #374151; font-size: .8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        @media (prefers-reduced-motion: reduce) { .mp-ficha { animation: none; } }
    </style>
    <!-- PWA: app instalable -->

    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

</head>

<body>
    <!-- Navbar -->
    <header class="global-nav">
        <nav class="nav-container">
            <a href="/" class="logo">
                <img src="/images/PueblosMágicos.svg.png" alt="Logo">
                Jalpan de Serra
            </a>
            <div class="nav-menu" id="nav-menu">
                <a href="/" class="nav-link" data-i18n="navbar.inicio">Inicio</a>
                <a href="/mapa.html" class="nav-link" data-i18n="navbar.mapa">Mapa</a>
                <a href="/restaurantes.html" class="nav-link" data-i18n="navbar.guia">Restaurantes</a>
                <a href="/hospedaje/hospedaje.html" class="nav-link" data-i18n="navbar.hospedaje">Hospedaje</a>
                <a href="/experiencias.html" class="nav-link" data-i18n="navbar.tours">Experiencias</a>
                <a href="/Contactos.html" class="nav-link" data-i18n="footer.contacto">Contacto</a>
            </div>
            <!-- El selector va FUERA de #navbar-actions: ese bloque se reconstruye al revisar la sesión -->
            <div class="nav-actions-wrapper" style="display: flex; align-items: center;">
                <select id="language-selector" aria-label="Idioma"
                    style="margin-right: 15px; padding: 5px; border-radius: 5px; border: 1px solid #ddd; background: white; font-family: var(--font-family);">
                    <option value="es" data-i18n="lang.switch_es">Español</option>
                    <option value="en" data-i18n="lang.switch_en">Inglés</option>
                    <option value="fr" data-i18n="lang.switch_fr">Français</option>
                </select>
                <div class="nav-actions" id="navbar-actions" style="display: flex; align-items: center;">
                    <a href="/login.html" class="btn-login" title="Iniciar sesión"><i class="far fa-user"></i> <span
                            data-i18n="navbar.iniciar_sesion">Iniciar Sesión</span></a>
                    <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <!-- Map Section -->
    <main class="map-section">
        <div class="map-wrapper">
            <div id="public-map"></div>
            <div class="mp-ficha" id="mp-ficha" role="dialog" aria-live="polite" hidden></div>
            <button type="button" class="mp-volver" id="mp-volver"><i class="fas fa-expand-arrows-alt"></i> <span data-i18n="mapa.volver">Ver todo el mapa</span></button>

            <aside class="map-sidebar" id="map-panel" aria-label="Explorar lugares">
                <button type="button" class="mp-asa" id="mp-asa" aria-label="Mostrar u ocultar la lista" aria-expanded="false"><span></span></button>
                <div class="mp-cab">
                    <div>
                        <h2 data-i18n="mapa.titulo">Explorar Jalpan</h2>
                        <p class="mp-total" id="mp-total" aria-live="polite">&nbsp;</p>
                    </div>
                    <button type="button" class="mp-cerca" id="mp-cerca" title="Ordenar por cercanía">
                        <i class="fas fa-location-arrow"></i><span data-i18n="mapa.cerca_btn">Cerca de mí</span>
                    </button>
                </div>

                <label class="mp-buscar">
                    <i class="fas fa-search" aria-hidden="true"></i>
                    <input type="search" id="mp-q" placeholder="Buscar un lugar" autocomplete="off" aria-label="Buscar un lugar">
                    <button type="button" class="mp-limpiar" id="mp-limpiar" aria-label="Borrar búsqueda" hidden><i class="fas fa-times"></i></button>
                </label>

                <div class="mp-chips" id="map-filters" role="group" aria-label="Categorías">

    <script>
        async function renderAuthNavbar() {
            const nav = document.getElementById('navbar-actions');
            if (!nav) return;
            const toggleBtn = document.getElementById('nav-toggle');
            const toggleHtml = toggleBtn ? toggleBtn.outerHTML : '<button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú"><i class="fas fa-bars"></i></button>';

            let currentUser = null;
            const token = localStorage.getItem('authToken');

            try {
                const stored = localStorage.getItem('currentUser');
                if (stored) currentUser = JSON.parse(stored);
            } catch (e) { }

            if (token) {
                try {
                    const endpoint = (currentUser && currentUser.rol === 'turista') ? '/api/auth/user/profile' : '/api/auth/profile';
                    const res = await fetch(endpoint, {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        currentUser = data.data && data.data.admin ? data.data.admin : data.data;
                        if (currentUser) {
                            localStorage.setItem('currentUser', JSON.stringify(currentUser));
                        }
                    } else {
                        localStorage.removeItem('authToken');
                        localStorage.removeItem('currentUser');
                        currentUser = null;
                    }
                } catch (e) {
                    console.error('Error validating session:', e);
                }
            }

            let buttonHtml = '';

            if (currentUser) {
                const nombreMostrar = currentUser.nombre ? currentUser.nombre.split(' ')[0] : 'Usuario';
                if (currentUser.rol === 'super-admin') {
                    buttonHtml = `
                        <a href="/panel-central.html" class="btn" style="background-color: #ec4899; color: white; display:flex;align-items:center;gap:0.4rem;padding:0.5rem 1rem; border-radius: 0.5rem;" title="Panel Super Admin">
                            <i class="fas fa-crown"></i> ${nombreMostrar}
                        </a>
                    `;
                } else if (currentUser.rol === 'turista') {
                    buttonHtml = `
                        <a href="/user-panel.html" class="btn-login" style="display:flex;align-items:center;gap:0.4rem;padding:0.5rem 1rem;" title="Mi Panel">
                            <i class="fas fa-user-circle"></i> ${nombreMostrar}
                        </a>
                    `;
                } else if (currentUser.rol === 'admin-turismo') {
                    buttonHtml = `
                        <a href="/admin-turismo.html" class="btn" style="background-color: #0d9488; color: white; display:flex;align-items:center;gap:0.4rem;padding:0.5rem 1rem; border-radius: 0.5rem;" title="Panel Turismo">
                            <i class="fas fa-compass"></i> ${nombreMostrar}
                        </a>
                    `;
                } else if (currentUser.rol === 'gobernamental') {
                    buttonHtml = `
                        <a href="/admin-gobierno.html" class="btn" style="background-color: #3b82f6; color: white; display:flex;align-items:center;gap:0.4rem;padding:0.5rem 1rem; border-radius: 0.5rem;" title="Panel Gubernamental">
                            <i class="fas fa-landmark"></i> ${nombreMostrar}
                        </a>
                    `;
                } else {
                    buttonHtml = `
                        <a href="/admin.html" class="btn" style="background-color: #10b981; color: white; display:flex;align-items:center;gap:0.4rem;padding:0.5rem 1rem; border-radius: 0.5rem;" title="Panel Admin">
                            <i class="fas fa-cog"></i> ${nombreMostrar}
                        </a>
                    `;
                }
            } else {
                buttonHtml = `
                    <a href="/login.html" class="btn-login"><i class="far fa-user"></i> Iniciar Sesión</a>
                `;
            }

            nav.innerHTML = `
                ${buttonHtml}
                ${toggleHtml}
            `;

            const newToggleBtn = document.getElementById('nav-toggle');
            const navMenu = document.getElementById('nav-menu');
            if (newToggleBtn && navMenu) {
                newToggleBtn.addEventListener('click', () => {
                    navMenu.classList.toggle('active');
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderAuthNavbar();
        });
    </script>
